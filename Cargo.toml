[workspace]
resolver = "3"
members = ["crates/radio", "crates/sim", "crates/dsp", "crates/zynqsdr", "crates/hpsdr", "crates/iq", "crates/hw", "crates/core", "crates/config", "crates/web", "crates/web888d", "crates/ftx", "crates/skim", "crates/wspr", "crates/jtty", "crates/jtty-wasm", "crates/markers", "crates/clock", "crates/digi-wasm", "crates/cw", "crates/cw-wasm", "crates/fsk", "crates/fsk-wasm", "crates/psk", "crates/psk-wasm", "crates/hfdl", "crates/js8", "crates/js8-wasm", "crates/hfdl-wasm", "crates/img", "crates/img-wasm", "crates/sigid", "crates/sigid-wasm", "crates/timecode", "crates/timecode-wasm"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/jeskko/web888-ng"

[workspace.dependencies]
web888-radio = { path = "crates/radio" }
web888-sim = { path = "crates/sim" }
web888-dsp = { path = "crates/dsp" }
web888-zynqsdr = { path = "crates/zynqsdr" }
web888-hpsdr = { path = "crates/hpsdr" }
web888-iq = { path = "crates/iq" }
web888-hw = { path = "crates/hw" }
web888-config = { path = "crates/config" }
web888-core = { path = "crates/core" }
web888-web = { path = "crates/web" }
web888-ftx = { path = "crates/ftx" }
web888-skim = { path = "crates/skim" }
web888-wspr = { path = "crates/wspr" }
web888-jtty = { path = "crates/jtty" }
web888-markers = { path = "crates/markers" }
web888-clock = { path = "crates/clock" }
web888-digi-wasm = { path = "crates/digi-wasm" }
web888-cw = { path = "crates/cw" }
web888-sigid = { path = "crates/sigid" }
web888-fsk = { path = "crates/fsk" }
web888-psk = { path = "crates/psk" }
web888-timecode = { path = "crates/timecode" }
web888-hfdl = { path = "crates/hfdl" }
web888-js8 = { path = "crates/js8" }
libc = "0.2.190"
num-complex = "0.4.6"
rustfft = "6.4.1"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

# DSP tests are slow unoptimised
[profile.test]
opt-level = 2

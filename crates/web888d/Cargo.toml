[package]
name = "web888d"
description = "web888-ng server for the Web-888 SDR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
web888-radio.workspace = true
web888-sim.workspace = true
web888-dsp.workspace = true
web888-zynqsdr.workspace = true
web888-hpsdr.workspace = true
web888-iq.workspace = true
web888-hw.workspace = true
web888-web.workspace = true
clap.workspace = true
num-complex.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync"] }
web888-config.workspace = true
libc.workspace = true

[features]
# live SDR devices (HackRF, ...) for `--backend iq` through SoapySDR
soapy = ["web888-iq/soapy"]

[package]
name = "web888-fsk"
description = "FSK/RTTY decoder with parameter detection and passband skimmer, after datarx's wahrx.fsk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
num-complex.workspace = true
rustfft.workspace = true
ionochannel = { workspace = true, optional = true }

[dependencies.web888-cw]
workspace = true

[features]
# test-signal synthesis (the `synth` module) through ionochannel
synth = ["dep:ionochannel"]

[dev-dependencies]
web888-fsk = { path = ".", features = ["synth"] }

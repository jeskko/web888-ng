[package]
name = "web888-cw"
description = "CW (Morse) decoder and passband skimmer, after datarx's wahrx.cw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
num-complex.workspace = true
rustfft.workspace = true
ionochannel = { workspace = true, optional = true }

[features]
# test-signal synthesis (the `synth` module) through ionochannel
synth = ["dep:ionochannel"]

[dev-dependencies]
web888-cw = { path = ".", features = ["synth"] }

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web888d-ui
          path: ui/dist

  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release --target armv7-unknown-linux-musleabihf -p web888d
      - uses: actions/upload-artifact@v4
        with:
          name: web888d-armv7-musl
          path: target/armv7-unknown-linux-musleabihf/release/web888d

  # Tags: publish the UI tarball and the device binary (web888-ng-os
  # fetches the UI from here by checksum).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui, armv7]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: doc/release-notes
      - uses: actions/download-artifact@v4
        with:
          name: web888d-ui
          path: ui-dist
      - uses: actions/download-artifact@v4
        with:
          name: web888d-armv7-musl
          path: bin
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$GITHUB_REF_NAME"
          mkdir out
          tar -C ui-dist --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -czf "out/web888d-ui-$v.tar.gz" .
          install -m 0755 bin/web888d "out/web888d-$v-armv7-musl"
          (cd out && sha256sum -- * > SHA256SUMS)
          pre=
          case "$v" in v0.*) pre=--prerelease ;; esac
          {
            echo "web888d $v, built by CI from this tag."
            echo
            echo "* \`web888d-ui-$v.tar.gz\`: the web UI (unpack into \`--ui-dir\`, default \`/usr/share/web888d/ui\`)"
            echo "* \`web888d-$v-armv7-musl\`: static binary for the Web-888"
            echo "* \`SHA256SUMS\`"
            # what's new, if written down for this version
            if [ -f "src/doc/release-notes/$v.md" ]; then
              echo
              cat "src/doc/release-notes/$v.md"
            fi
            if [ -n "$pre" ]; then
              echo
              echo "**Pre-release: not yet tested on a Web-888.**"
            fi
          } > notes.md
          gh release create "$v" --repo "$GITHUB_REPOSITORY" \
            --title "$v" --notes-file notes.md $pre out/*
